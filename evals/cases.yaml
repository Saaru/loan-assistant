# Evaluation cases: real customer questions with checks that can be graded without a model.
#
# Each turn's `expect` block is checked against what the app streamed for that turn:
#   tools / tools_any      tools that must be called (all / at least one)
#   no_tools               the answer must not call any tool
#   contains / contains_any   text that must appear in the reply (all / at least one); case and spacing ignored
#   not_contains           text that must not appear
#   cites / cites_any      policy rule IDs that must be cited, e.g. RR-2
#   action_proposed        an action card of this type must be offered (optionally with requires_otp)
#   action_executed        an action of this type must have run by the end of the turn
#
# Expected figures come from the synthetic data and are the same on any business date
# (checked across dates months apart). Dates themselves are never asserted.

- id: emi_change_cause
  category: precise answers
  customer: CUST1001
  turns:
    - say: My EMI went up this month. Why?
      expect:
        tools: [explain_emi_change]
        contains: ["20,969", "21,179"]
        contains_any: ["rate", "reset", "benchmark"]
        cites_any: [RR-1, RR-2]

- id: prepayment_interest_saved
  category: calculations
  customer: CUST1001
  turns:
    - say: If I make a ₹50,000 prepayment today, how much interest would I save?
      expect:
        tools: [simulate_prepayment]
        contains: ["18,828"]
        not_contains: ["prepayment charge of ₹"]

- id: tenure_follow_up_in_context
  category: conversation context
  customer: CUST1001
  turns:
    - say: If I prepay ₹50,000 today, how much interest do I save?
      expect:
        tools: [simulate_prepayment]
    - say: Okay, and would paying ₹20,000 extra reduce my tenure?
      expect:
        tools: [simulate_prepayment]
        contains: ["7,795"]
        not_contains: ["which loan"]

- id: floating_foreclosure_penalty_free
  category: business rules
  customer: CUST1001
  turns:
    - say: Can I foreclose my loan without paying a penalty?
      expect:
        tools: [check_foreclosure]
        contains_any: ["no foreclosure charge", "penalty-free", "penalty free", "no penalty", "without any penalty", "without a penalty", "no charge"]
        cites_any: [FC-2]

- id: failed_payments_explained
  category: multi-system answers
  customer: CUST1002
  turns:
    - say: Show me the payments that failed in the last six months and explain what happened.
      expect:
        tools: [get_payment_history]
        contains: ["590"]
        contains_any: ["technical"]
        not_contains: ["CUST1001", "Priya"]

- id: fixed_foreclosure_charge
  category: business rules
  customer: CUST1002
  turns:
    - say: Am I eligible for foreclosure without a penalty?
      expect:
        tools: [check_foreclosure]
        contains: ["6,996"]
        contains_any: ["4%", "4.0%", "4 %"]
        cites_any: [FC-2]

- id: fixed_prepayment_charges
  category: calculations
  customer: CUST1002
  turns:
    - say: What would it cost me in charges to prepay ₹20,000 on my loan?
      expect:
        tools: [simulate_prepayment]
        contains: ["708"]
        cites_any: [PP-4]

- id: dispute_confirmed_by_voice_style_yes
  category: actions
  customer: CUST1002
  turns:
    - say: Which of my failed payments was the bank's fault?
      expect:
        tools: [get_payment_history]
        contains_any: ["technical"]
    - say: Can you get that charge reversed?
      expect:
        action_proposed: {type: charge_dispute, requires_otp: false}
        not_contains: ["otp has been sent", "read the otp", "enter the otp"]
    - say: Yes, go ahead.
      expect:
        tools: [confirm_action]
        action_executed: charge_dispute
        contains_any: ["reversed", "credited", "waived"]

- id: mandate_request_no_otp
  category: actions
  customer: CUST1002
  turns:
    - say: My auto-debit mandate is inactive. Can you raise a request to register a new one?
      expect:
        action_proposed: {type: service_request, requires_otp: false}
        not_contains: ["otp has been sent", "read the otp", "enter the otp"]

- id: two_loans_next_emi
  category: precise answers
  customer: CUST1003
  turns:
    - say: What's my next EMI?
      expect:
        tools: [get_loans]
        contains: ["11,798", "7,237"]
        not_contains: ["19,034", "19,036"]   # if a total is given it must be the tool's, 19,035

- id: lock_in_blocks_prepayment
  category: business rules
  customer: CUST1003
  turns:
    - say: Can I prepay ₹30,000 on my fixed-rate loan right now?
      expect:
        tools: [simulate_prepayment]
        contains_any: ["lock-in", "lock in", "locked", "opens only after", "only after 6", "after 6 emis", "not yet"]
        cites_any: [PP-1]

- id: card_decline_reason
  category: second workflow
  customer: CUST1003
  workspace: card_servicing
  turns:
    - say: Why was my card declined in Dubai?
      expect:
        tools: [get_card_transactions]
        contains_any: ["international"]

